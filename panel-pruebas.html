<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia Atelier — Panel de pruebas API</title>
<style>
  :root{
    --bg: #16181d;
    --panel: #1e2129;
    --panel-alt: #262a34;
    --line: #343946;
    --text: #e8e6df;
    --text-dim: #9a9fae;
    --accent: #c98a4b;
    --accent-soft: #4a3826;
    --ok: #7fb887;
    --err: #d9756b;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height:1.45;
  }
  header{
    padding: 22px 28px 18px;
    border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:16px 28px; align-items:flex-end;
  }
  header .title{ font-family:var(--serif); }
  header h1{
    margin:0; font-size:1.5rem; font-weight:500; letter-spacing:.2px;
  }
  header p{ margin:4px 0 0; color:var(--text-dim); font-size:.9rem; }
  .conn{ display:flex; gap:8px; align-items:center; margin-left:auto; flex-wrap:wrap; }
  .conn label{ font-size:.78rem; color:var(--text-dim); }
  input, textarea, select{
    background:var(--panel-alt); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:8px 10px; font-size:.88rem; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  #baseUrl{ width:260px; font-family:var(--mono); }
  button{
    background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent);
    border-radius:6px; padding:8px 14px; font-size:.85rem; cursor:pointer;
    font-weight:600; letter-spacing:.2px;
  }
  button:hover{ background:var(--accent); color:#1a1208; }
  button.ghost{ background:transparent; color:var(--text-dim); border-color:var(--line); }
  button.ghost:hover{ background:var(--panel-alt); color:var(--text); }
  button.danger{ border-color:var(--err); color:var(--err); background:transparent; }
  button.danger:hover{ background:var(--err); color:#20100e; }
  #status-dot{ width:9px; height:9px; border-radius:50%; background:var(--text-dim); display:inline-block; margin-right:6px; }
  #status-dot.ok{ background:var(--ok); }
  #status-dot.err{ background:var(--err); }

  nav{
    display:flex; gap:2px; padding:0 28px; border-bottom:1px solid var(--line);
    overflow-x:auto; background:var(--panel);
  }
  nav button.tab{
    background:none; border:none; color:var(--text-dim); border-bottom:2px solid transparent;
    border-radius:0; padding:13px 16px; font-size:.85rem; white-space:nowrap;
  }
  nav button.tab:hover{ color:var(--text); background:none; }
  nav button.tab.active{ color:var(--accent); border-bottom-color:var(--accent); }

  main{ padding:24px 28px 60px; max-width:1100px; margin:0 auto; }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .grid{ display:grid; grid-template-columns: 1.1fr 1fr; gap:20px; align-items:start; }
  @media (max-width: 880px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px 20px;
  }
  .card h2{ margin:0 0 4px; font-size:1.02rem; font-weight:600; }
  .card .sub{ color:var(--text-dim); font-size:.78rem; margin-bottom:14px; }
  .card .sub code{ font-family:var(--mono); color:#b7a68b; }

  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:.75rem; color:var(--text-dim); margin-bottom:4px; }
  .field input, .field textarea{ width:100%; }
  textarea.json{ font-family:var(--mono); font-size:.82rem; min-height:150px; resize:vertical; }

  .row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .list{ display:flex; flex-direction:column; gap:10px; max-height:520px; overflow:auto; padding-right:2px; }
  .item{
    border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:var(--panel-alt);
    font-size:.82rem;
  }
  .item .kv{ display:grid; grid-template-columns: auto 1fr; gap:2px 10px; }
  .item .kv dt{ color:var(--text-dim); font-family:var(--mono); font-size:.74rem; }
  .item .kv dd{ margin:0; word-break:break-word; }
  .item .actions{ margin-top:8px; display:flex; gap:6px; }
  .item .actions button{ padding:4px 9px; font-size:.72rem; }
  .empty{ color:var(--text-dim); font-size:.85rem; padding:10px 2px; }

  .log{
    font-family:var(--mono); font-size:.75rem; background:#111318; border:1px solid var(--line);
    border-radius:6px; padding:10px 12px; white-space:pre-wrap; word-break:break-word;
    max-height:140px; overflow:auto; color:#a9d3ae;
  }
  .log.err{ color:#e8a49d; }
  .hint{ font-size:.74rem; color:var(--text-dim); margin-top:10px; }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>Academia Atelier</h1>
    <p>Panel de pruebas para el backend Spring Boot (datos temporales en memoria)</p>
  </div>
  <div class="conn">
    <div>
      <label for="baseUrl">URL base</label><br>
      <input id="baseUrl" type="text" value="http://localhost:8080">
    </div>
    <button class="ghost" onclick="checkConnection()"><span id="status-dot"></span>Probar conexión</button>
  </div>
</header>

<nav id="tabs"></nav>

<main id="panels"></main>

<script>
const RESOURCES = [
  {
    key: "obras",
    label: "Obras",
    endpoint: "/api/obras",
    note: "Estado: DISPONIBLE / NO_DISPONIBLE. Precio no negativo, moneda de 3 caracteres.",
    example: {
      nombre: "Retrato al oleo",
      descripcionArtistica: "Óleo sobre lienzo, 60x80cm, técnica de veladuras.",
      descripcionTecnica: "Oleo sobre lienzo, 60x80 cm.",
      precio: 350000,
      moneda: "COP",
      estado: "NO_DISPONIBLE",
      fechaPublicacion: "2026-09-11"
    }
  },
  {
    key: "imagenes-obra",
    label: "Imágenes de obra",
    endpoint: "/api/imagenes-obra",
    note: "obraId debe existir. ordenVisualizacion >= 0. Reemplaza obraId con un UUID real.",
    example: {
      obraId: "00000000-0000-0000-0000-000000000000",
      urlImagen: "https://ejemplo.com/imagenes/obra-1.jpg",
      textoAlternativo: "Vista frontal del retrato al óleo",
      ordenVisualizacion: 0,
      esPrincipal: true
    }
  },
  {
    key: "solicitudes-clase",
    label: "Solicitudes de clase",
    endpoint: "/api/solicitudes-clase",
    note: "El estado inicial siempre debe quedar en SOLICITADA (lo asigna el backend).",
    example: {
      nombreCliente: "Ana Martinez",
      numeroWhatsapp: "+573001234567",
      fechaSolicitada: "2026-09-20",
      horaSolicitada: "15:00:00",
      tipoClase: "Dibujo a lapiz",
      cantidadEstudiantes: 2,
      descripcionSolicitud: "Quiero aprender tecnicas basicas.",
      observacionesAdicionales: "Tengo materiales propios."
    }
  },
  {
    key: "solicitudes-trabajo-personalizado",
    label: "Solicitudes de encargo",
    endpoint: "/api/solicitudes-trabajo-personalizado",
    note: "El estado inicial siempre debe quedar en RECIBIDA (lo asigna el backend).",
    example: {
      nombreCliente: "Carlos Perez",
      numeroWhatsapp: "+573007654321",
      correoElectronico: "carlos@example.com",
      descripcionProyecto: "Retrato personalizado de familia en óleo, tamaño mediano."
    }
  },
  {
    key: "imagenes-trabajo-personalizado",
    label: "Imágenes de encargo",
    endpoint: "/api/imagenes-trabajo-personalizado",
    note: "solicitudId debe existir. Estas imágenes son referencias privadas del cliente.",
    example: {
      solicitudId: "00000000-0000-0000-0000-000000000000",
      urlImagen: "https://ejemplo.com/referencias/foto-familia.jpg",
      textoAlternativo: "Foto de referencia enviada por el cliente"
    }
  },
  {
    key: "administradores",
    label: "Administradores",
    endpoint: "/api/administradores",
    note: "hashContrasena es de solo escritura: se envía al crear pero nunca vuelve en las respuestas.",
    example: {
      correoElectronico: "admin@atelier.example",
      hashContrasena: "reemplazar-por-hash-real",
      nombreCompleto: "Administrador Atelier",
      estaActivo: true
    }
  }
];

const tabsEl = document.getElementById("tabs");
const panelsEl = document.getElementById("panels");

function baseUrl(){
  return document.getElementById("baseUrl").value.replace(/\/$/, "");
}

RESOURCES.forEach((r, i) => {
  const tab = document.createElement("button");
  tab.className = "tab" + (i === 0 ? " active" : "");
  tab.textContent = r.label;
  tab.onclick = () => selectTab(r.key);
  tab.dataset.key = r.key;
  tabsEl.appendChild(tab);

  const panel = document.createElement("section");
  panel.className = "panel" + (i === 0 ? " active" : "");
  panel.id = "panel-" + r.key;
  panel.innerHTML = buildPanel(r);
  panelsEl.appendChild(panel);
});

function selectTab(key){
  document.querySelectorAll("nav .tab").forEach(t => t.classList.toggle("active", t.dataset.key === key));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + key));
}

function buildPanel(r){
  const exampleStr = JSON.stringify(r.example, null, 2);
  return `
  <div class="grid">
    <div class="card">
      <h2>Crear / actualizar</h2>
      <div class="sub">Endpoint: <code>${r.endpoint}</code> — ${r.note}</div>

      <div class="field">
        <label>Cuerpo JSON</label>
        <textarea class="json" id="body-${r.key}">${exampleStr}</textarea>
      </div>
      <div class="row">
        <button onclick="createItem('${r.key}')">POST crear</button>
      </div>

      <div class="field" style="margin-top:18px;">
        <label>ID para actualizar / eliminar / buscar uno</label>
        <input id="id-${r.key}" placeholder="UUID del registro">
      </div>
      <div class="row">
        <button class="ghost" onclick="getOne('${r.key}')">GET por id</button>
        <button class="ghost" onclick="updateItem('${r.key}')">PUT actualizar</button>
        <button class="danger" onclick="deleteItem('${r.key}')">DELETE eliminar</button>
      </div>

      <div class="hint">El campo "actualizar" reutiliza el mismo cuerpo JSON de arriba.</div>
      <div class="log" id="log-${r.key}">Sin actividad todavía.</div>
    </div>

    <div class="card">
      <h2>Listado</h2>
      <div class="sub">GET <code>${r.endpoint}</code></div>
      <div class="row" style="margin-top:0;">
        <button class="ghost" onclick="listItems('${r.key}')">Recargar lista</button>
      </div>
      <div class="list" id="list-${r.key}" style="margin-top:12px;">
        <div class="empty">Presiona "Recargar lista" para consultar el backend.</div>
      </div>
    </div>
  </div>`;
}

function setLog(key, message, isError){
  const el = document.getElementById("log-" + key);
  el.textContent = message;
  el.classList.toggle("err", !!isError);
}

async function request(path, options){
  const url = baseUrl() + path;
  try{
    const res = await fetch(url, options);
    let data = null;
    const text = await res.text();
    if(text){
      try{ data = JSON.parse(text); } catch(e){ data = text; }
    }
    return { ok: res.ok, status: res.status, data };
  } catch(e){
    return { ok:false, status:0, data:{ message: "No se pudo contactar " + url + " — ¿está corriendo el backend? (" + e.message + ")" } };
  }
}

function readBody(key){
  const raw = document.getElementById("body-" + key).value;
  try{
    return { ok:true, value: JSON.parse(raw) };
  } catch(e){
    return { ok:false, error: "El JSON del cuerpo no es válido: " + e.message };
  }
}

async function listItems(key){
  const r = RESOURCES.find(x => x.key === key);
  const listEl = document.getElementById("list-" + key);
  listEl.innerHTML = `<div class="empty">Cargando…</div>`;
  const res = await request(r.endpoint, { method: "GET" });
  if(!res.ok){
    listEl.innerHTML = `<div class="empty">Error ${res.status || ""}: ${escapeHtml(res.data && res.data.message || "no se pudo listar")}</div>`;
    return;
  }
  const items = Array.isArray(res.data) ? res.data : [];
  if(items.length === 0){
    listEl.innerHTML = `<div class="empty">Sin registros todavía.</div>`;
    return;
  }
  listEl.innerHTML = items.map(item => renderItem(key, item)).join("");
}

function renderItem(key, item){
  const id = item.id || item.uuid || "";
  const rows = Object.entries(item).map(([k, v]) => {
    return `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(formatValue(v))}</dd>`;
  }).join("");
  return `
  <div class="item">
    <dl class="kv">${rows}</dl>
    <div class="actions">
      <button class="ghost" onclick="fillId('${key}','${id}')">Usar este ID</button>
    </div>
  </div>`;
}

function formatValue(v){
  if(v === null || v === undefined) return "—";
  if(typeof v === "object") return JSON.stringify(v);
  return String(v);
}

function fillId(key, id){
  document.getElementById("id-" + key).value = id;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[s]));
}

async function createItem(key){
  const r = RESOURCES.find(x => x.key === key);
  const body = readBody(key);
  if(!body.ok){ setLog(key, body.error, true); return; }
  const res = await request(r.endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body.value)
  });
  setLog(key, `POST ${r.endpoint} → ${res.status}\n` + JSON.stringify(res.data, null, 2), !res.ok);
  if(res.ok) listItems(key);
}

async function getOne(key){
  const r = RESOURCES.find(x => x.key === key);
  const id = document.getElementById("id-" + key).value.trim();
  if(!id){ setLog(key, "Escribe un ID primero.", true); return; }
  const res = await request(r.endpoint + "/" + id, { method: "GET" });
  setLog(key, `GET ${r.endpoint}/${id} → ${res.status}\n` + JSON.stringify(res.data, null, 2), !res.ok);
  if(res.ok) document.getElementById("body-" + key).value = JSON.stringify(res.data, null, 2);
}

async function updateItem(key){
  const r = RESOURCES.find(x => x.key === key);
  const id = document.getElementById("id-" + key).value.trim();
  if(!id){ setLog(key, "Escribe un ID primero.", true); return; }
  const body = readBody(key);
  if(!body.ok){ setLog(key, body.error, true); return; }
  const res = await request(r.endpoint + "/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body.value)
  });
  setLog(key, `PUT ${r.endpoint}/${id} → ${res.status}\n` + JSON.stringify(res.data, null, 2), !res.ok);
  if(res.ok) listItems(key);
}

async function deleteItem(key){
  const r = RESOURCES.find(x => x.key === key);
  const id = document.getElementById("id-" + key).value.trim();
  if(!id){ setLog(key, "Escribe un ID primero.", true); return; }
  const res = await request(r.endpoint + "/" + id, { method: "DELETE" });
  setLog(key, `DELETE ${r.endpoint}/${id} → ${res.status}` + (res.data ? "\n" + JSON.stringify(res.data, null, 2) : ""), !res.ok);
  if(res.ok) listItems(key);
}

async function checkConnection(){
  const dot = document.getElementById("status-dot");
  dot.className = "";
  const res = await request("/api/obras", { method: "GET" });
  dot.className = res.status ? "ok" : "err";
  if(!res.status){
    alert("No se pudo conectar con " + baseUrl() + ". Revisa que el backend esté corriendo (./mvnw.cmd spring-boot:run).");
  }
}

// Carga inicial: intenta listar obras al abrir
listItems("obras");
checkConnection();
</script>

</body>
</html>
